<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 380" fill="none" role="img" aria-labelledby="sparesxTitle sparesxDesc">
  <title id="sparesxTitle">SparesX</title>
  <desc id="sparesxDesc">SparesX logo — microchip icon with circuit traces above the SparesX wordmark</desc>

  <!--
    Colors match brand mark:
      charcoal #374151
      blue     #2563EB
  -->
  <g transform="translate(68 36)">
    <!-- Incomplete rounded chip frame (gap at top-right) -->
    <path
      d="M 128 16
         H 48
         C 26 16 16 26 16 48
         V 136
         C 16 158 26 168 48 168
         H 136
         C 158 168 168 158 168 136
         V 88"
      stroke="#374151"
      stroke-width="15"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Three left-edge pins -->
    <path
      d="M 16 56 H 0
         M 16 92 H 0
         M 16 128 H 0"
      stroke="#374151"
      stroke-width="15"
      stroke-linecap="round"
    />

    <!-- Circuit traces: horizontal then up into the open corner -->
    <path
      d="M 50 120 H 74 V 62"
      stroke="#2563EB"
      stroke-width="13"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <path
      d="M 50 132 H 104 V 44"
      stroke="#2563EB"
      stroke-width="13"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <path
      d="M 50 144 H 138 V 22"
      stroke="#2563EB"
      stroke-width="13"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Trace end-nodes -->
    <circle cx="74" cy="62" r="10" fill="#2563EB"/>
    <circle cx="104" cy="44" r="10" fill="#2563EB"/>
    <circle cx="138" cy="22" r="10" fill="#2563EB"/>
  </g>

  <!-- Wordmark -->
  <text
    x="160"
    y="330"
    text-anchor="middle"
    fill="#374151"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
    font-size="58"
    font-weight="600"
    letter-spacing="-0.025em"
  >SparesX</text>
</svg>
